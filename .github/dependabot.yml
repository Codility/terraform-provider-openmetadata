version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      go-dependencies:
        patterns: ["*"]

  # Actions are SHA-pinned; dependabot keeps the pins current.
  # Majors stay ungrouped — a breaking action lands in the release path.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
